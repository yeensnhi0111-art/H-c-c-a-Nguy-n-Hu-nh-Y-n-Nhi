<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Cá Đại Dương - YEN NHI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas chính hiển thị hồ cá -->
    <canvas id="aquariumCanvas"></canvas>

    <!-- Màn hình chờ xử lý tách nền ảnh -->
    <div id="loading">Đang chuẩn bị hồ cá & tách nền sinh vật...</div>

    <!-- Nút điều khiển bật/tắt âm thanh -->
    <button id="audioToggle" title="Bật / Tắt âm thanh">🔇 Bật âm thanh</button>

    <!-- Trình phát âm thanh từ file .mp4 (ẩn hình ảnh, chỉ phát tiếng lặp lại) -->
    <video id="bgAudio" src="audio/bg-music.mp4" loop playsinline preload="auto"></video>

    <script src="script.js"></script>
</body>
</html>
